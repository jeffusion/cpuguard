name: Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST="${LATEST_TAG#v}"
            COMMIT_MSG=$(git log -1 --format=%s)

            if echo "$COMMIT_MSG" | grep -qi "breaking change"; then
              MAJOR=$(( ${LATEST%%.*} + 1 ))
              NEW="v${MAJOR}.0.0"
            elif echo "$COMMIT_MSG" | grep -qE "^feat(\(.*\))?:"; then
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              NEW="v${MAJOR}.$(( MINOR + 1 )).0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
              NEW="v${MAJOR}.${MINOR}.$(( PATCH + 1 ))"
            fi

            if ! echo "$NEW" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid tag: ${NEW}. Aborting."
              exit 1
            fi

            if git rev-parse "${NEW}" >/dev/null 2>&1; then
              echo "Tag ${NEW} already exists, skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            git tag "${NEW}"
            git push origin "${NEW}"
            echo "name=${NEW}" >> $GITHUB_OUTPUT
          fi

      - name: Build linux/amd64
        if: steps.tag.outputs.skip != 'true'
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o bin/amd64/cpuguardd ./cmd/cpuguardd
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o bin/amd64/cpuguardctl ./cmd/cpuguardctl
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o bin/amd64/cpuguard-burn ./cmd/cpuguard-burn

      - name: Package linux/amd64
        if: steps.tag.outputs.skip != 'true'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          PKGDIR="cpuguard_${VERSION}_linux_amd64"
          mkdir -p "${PKGDIR}"
          cp bin/amd64/cpuguardd bin/amd64/cpuguardctl bin/amd64/cpuguard-burn "${PKGDIR}/"
          cp examples/config.yaml "${PKGDIR}/config.yaml"
          cp packaging/systemd/cpuguard.service "${PKGDIR}/cpuguard.service"
          tar -czf "${PKGDIR}.tar.gz" "${PKGDIR}"

      - name: Build linux/arm64
        if: steps.tag.outputs.skip != 'true'
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o bin/arm64/cpuguardd ./cmd/cpuguardd
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o bin/arm64/cpuguardctl ./cmd/cpuguardctl
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" -o bin/arm64/cpuguard-burn ./cmd/cpuguard-burn

      - name: Package linux/arm64
        if: steps.tag.outputs.skip != 'true'
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          PKGDIR="cpuguard_${VERSION}_linux_arm64"
          mkdir -p "${PKGDIR}"
          cp bin/arm64/cpuguardd bin/arm64/cpuguardctl bin/arm64/cpuguard-burn "${PKGDIR}/"
          cp examples/config.yaml "${PKGDIR}/config.yaml"
          cp packaging/systemd/cpuguard.service "${PKGDIR}/cpuguard.service"
          tar -czf "${PKGDIR}.tar.gz" "${PKGDIR}"

      - name: Create release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh release create "${TAG}" cpuguard_*.tar.gz \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
